<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Подарки для Мирославы 🦄</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', 'Comic Sans MS', sans-serif;
    background: linear-gradient(135deg, #ffe0f0 0%, #e0d4ff 50%, #d4f0ff 100%);
    min-height: 100vh;
    padding: 20px;
    color: #5a3d6b;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  header {
    text-align: center;
    padding: 30px 20px;
    background: rgba(255,255,255,0.6);
    border-radius: 30px;
    margin-bottom: 30px;
    box-shadow: 0 8px 30px rgba(180,140,220,0.2);
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '🦄 ✨ 🧜‍♀️ ✨ 🦄';
    position: absolute;
    top: 10px; left: 0; right: 0;
    font-size: 20px;
    opacity: 0.5;
    letter-spacing: 20px;
  }
  h1 {
    font-size: 2.5em;
    color: #b857c9;
    margin: 20px 0 10px;
    text-shadow: 2px 2px 0 #fff, 4px 4px 0 rgba(184,87,201,0.2);
  }
  .subtitle { font-size: 1.1em; color: #7a5c8f; line-height: 1.5; max-width: 700px; margin: 0 auto; }
  .date-badge {
    display: inline-block;
    background: linear-gradient(135deg, #ffb6e1, #c9a7ff);
    color: #fff;
    padding: 8px 24px;
    border-radius: 30px;
    font-weight: bold;
    margin: 15px 0;
    font-size: 1.1em;
    box-shadow: 0 4px 15px rgba(200,140,220,0.4);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
  }
  .card {
    background: #fff;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 6px 20px rgba(180,140,220,0.15);
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
    border: 3px solid #ffe0f5;
    padding: 20px;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(180,140,220,0.3); }
  .card.taken { opacity: 0.7; border-color: #c0c0c0; background: #f5f5f5; }
  .card-emoji { font-size: 3em; text-align: center; margin-bottom: 10px; }
  .card-body { flex: 1; display: flex; flex-direction: column; }
  .card-title { font-size: 1.05em; font-weight: 600; margin-bottom: 10px; color: #5a3d6b; min-height: 50px; line-height: 1.3; }
  .card-price { font-size: 1.4em; font-weight: bold; color: #b857c9; margin-bottom: 15px; }
  .card-actions { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
  .btn {
    padding: 11px 16px;
    border-radius: 14px;
    border: none;
    font-size: 0.95em;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    transition: all 0.2s;
    font-family: inherit;
    display: block;
  }
  .btn-ozon { background: linear-gradient(135deg, #005bff, #0070ff); color: #fff; }
  .btn-ozon:hover { background: linear-gradient(135deg, #0048cc, #005bff); }
  .btn-status { background: #e8f5e9; color: #2e7d32; }
  .btn-status:hover { background: #c8e6c9; }
  .btn-status.taken { background: #ffebee; color: #c62828; }
  .btn-status.taken:hover { background: #ffcdd2; }
  .btn-status:disabled { opacity: 0.5; cursor: wait; }
  .loading { text-align: center; padding: 40px; font-size: 1.2em; color: #b857c9; }
  footer { text-align: center; padding: 30px 20px; color: #7a5c8f; font-size: 0.95em; }
  @media (max-width: 500px) {
    h1 { font-size: 1.8em; }
    header::before { font-size: 14px; letter-spacing: 12px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Подарки для Мирославы 🦄</h1>
    <div class="date-badge">🎂 22 октября • 4 года 🎂</div>
    <p class="subtitle">Выберите подарок и отметьте его занятым, чтобы другие не дарили то же самое 💕</p>
  </header>

  <div id="content">
    <div class="loading">✨ Загружаем подарки... ✨</div>
  </div>

  <footer>
    Спасибо, что разделите с нами этот праздник! 🎉🧜‍♀️✨
  </footer>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwfyVYA0sc8TBORX1TaknRrkMxHbaJg9j9kfH5oDSBt0aCYPcD8mlXm6cWP9A09wHHtwA/exec";

// Эмодзи для каждого подарка (по ID). Можно поменять на любые.
const EMOJI = {
  1:  "🎨", // Фломограф
  2:  "🐸", // Лягушка ест бобы
  3:  "🐧", // Морозная миссия
  4:  "🐶", // Интерактивная собака
  5:  "🍕", // Пицца
  6:  "🖍️", // Раскраска
  7:  "🦄", // Постельное "Единорог"
  8:  "🩰", // Постельное "Балерина"
  9:  "🎎", // Кукла
  10: "🏠"  // Кукольный домик
};

let gifts = [];

async function loadGifts() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    if (!data.ok) throw new Error("Ошибка загрузки");
    gifts = data.items;
    render();
  } catch (err) {
    document.getElementById("content").innerHTML =
      '<div class="loading">😔 Не удалось загрузить подарки. Обновите страницу.</div>';
  }
}

function render() {
  const content = document.getElementById("content");
  content.innerHTML = '<div class="grid" id="grid"></div>';
  const grid = document.getElementById("grid");

  gifts.forEach(g => {
    // Читаем поля, устойчиво к регистру и пробелам
    const get = (obj, key) => {
      const found = Object.keys(obj).find(k => k.trim().toLowerCase() === key.toLowerCase());
      return found ? String(obj[found]).trim() : "";
    };

    const id       = get(g, "ID");
    const title    = get(g, "Подарок");
    const price    = get(g, "Цена");
    const link     = get(g, "Ссылка");
    const status   = get(g, "Статус");
    const isTaken  = status === "Занято";

    const card = document.createElement("div");
    card.className = "card" + (isTaken ? " taken" : "");
    card.innerHTML = `
      <div class="card-emoji">${EMOJI[id] || "🎁"}</div>
      <div class="card-body">
        <div class="card-title">${title}</div>
        <div class="card-price">${price} ₽</div>
        <div class="card-actions">
          <a class="btn btn-ozon" href="${link}" target="_blank" rel="noopener">🛒 Перейти на Ozon</a>
          <button class="btn btn-status ${isTaken ? 'taken' : ''}" data-id="${id}" data-status="${status}">
            ${isTaken ? '✅ Занято (нажми, чтобы снять)' : '🎁 Занять подарок'}
          </button>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });

  document.querySelectorAll(".btn-status").forEach(btn => {
    btn.addEventListener("click", () => toggleStatus(btn));
  });
}

async function toggleStatus(btn) {
  const id = btn.dataset.id;
  const current = btn.dataset.status;
  const newStatus = current === "Занято" ? "Свободно" : "Занято";

  btn.disabled = true;
  btn.textContent = "⏳ Обновляем...";

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ id: id, status: newStatus })
    });
    const data = await res.json();
    if (data.ok) {
      // Перезагружаем данные, чтобы отобразить актуальные статусы у всех
      await loadGifts();
    } else {
      alert("Ошибка: " + (data.error || "неизвестная"));
      btn.disabled = false;
      loadGifts();
    }
  } catch (err) {
    alert("Не удалось обновить. Проверьте интернет.");
    btn.disabled = false;
    loadGifts();
  }
}

loadGifts();
</script>
</body>
</html>
